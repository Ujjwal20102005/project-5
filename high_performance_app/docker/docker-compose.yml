services:
  app:
    build: { context: .., dockerfile: docker/Dockerfile }
    ports: ["8080:8080"]
    environment:
      HPAPP_STRATEGY: thorough
      HPAPP_PROCESS_WORKERS: "4"
      HPAPP_WORKERS: "64"
    volumes: ["appdata:/data"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes:
      - ../monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/hpapp.json:ro
    depends_on: [prometheus]
volumes:
  appdata: {}
